version: '3.8'

services:
  app:
    build: .
    container_name: deploy-zero-cost
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=False
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - deploy-network

networks:
  deploy-network:
    driver: bridge
